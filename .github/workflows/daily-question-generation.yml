name: Daily Question Generation

on:
  schedule:
    # Runs at 00:00 UTC every day. Adjust the cron if you want a
    # different "midnight" reference timezone.
    - cron: "0 0 * * *"
  workflow_dispatch: {} # allows manually triggering from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate questions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_questions.py

      - name: Commit updated questions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/questions.json
          git diff --staged --quiet || git commit -m "chore: daily question update $(date -u +'%Y-%m-%d')"
          git push
