name: Daily Question Generation

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate questions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_questions.py

      - name: Commit updated questions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/manifest.json data/questions/

          git diff --staged --quiet || git commit \
            -m "chore: daily question update $(date -u +'%Y-%m-%d')"

          git push
